<script>
  (function initPatientMapInteraction() {
    const chips = document.querySelectorAll('.location-chip');
    const pin = document.getElementById('patient-pin-container');
    const routeBtn = document.getElementById('find-route-btn');

    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        // Clear previous active states
        chips.forEach(c => {
          c.className = 'location-chip h-[38px] px-4 rounded-xl flex items-center space-x-1.5 transition-colors font-label-lg text-label-lg bg-surface-container-low text-on-surface-variant hover:bg-surface-container';
          const icon = c.querySelector('span.material-symbols-outlined');
          if (icon) icon.remove();
        });

        // Activate clicked chip
        chip.className = 'location-chip h-[38px] px-4 rounded-xl flex items-center space-x-1.5 transition-colors font-label-lg text-label-lg bg-primary text-on-primary shadow-sm';
        const checkIcon = document.createElement('span');
        checkIcon.className = 'material-symbols-outlined text-[16px]';
        checkIcon.style.fontVariationSettings = "'FILL' 1";
        checkIcon.innerText = 'check';
        chip.prepend(checkIcon);

        // Move the beacon pin on the map
        const targetX = chip.getAttribute('data-x');
        const targetY = chip.getAttribute('data-y');
        if (pin && targetX && targetY) {
          pin.style.left = targetX + 'px';
          pin.style.top = targetY + 'px';
        }
      });
    });

    if (routeBtn) {
      routeBtn.addEventListener('click', () => {
        routeBtn.classList.add('scale-[0.98]');
        setTimeout(() => routeBtn.classList.remove('scale-[0.98]'), 150);
      });
    }
  })();
